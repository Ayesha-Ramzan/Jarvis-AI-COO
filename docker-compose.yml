services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      # Required - no default, by design. Copy .env.example to .env and set
      # a real value, or export POSTGRES_PASSWORD before compose up.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
    # No host port is published: the database is reachable only on the
    # internal compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - copy .env.example to .env}@db:5432/${POSTGRES_DB:-jarvis}
      SEED_FIXTURE_ORGANIZATIONS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Reported test source of truth: runs the FULL suite against PostgreSQL
  # on a dedicated database (jarvis_test) that the suite drops and recreates
  # before running, so it is always safe to reset. Usage:
  #   docker compose --profile test run --rm test
  test:
    build: .
    profiles: ["test"]
    volumes:
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
    environment:
      ENVIRONMENT: test
      SEED_FIXTURE_ORGANIZATIONS: "false"
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD}@db:5432/jarvis_test
      TEST_DATABASE_ADMIN_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-v"]

volumes:
  pgdata:
